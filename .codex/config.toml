#トークン消費を抑えるための、プロジェクト固有のCodexデフォルト設定

# 通常のタスクではデフォルトでコストを低く抑える。詳細なレビューを行う際は、プロンプトごとにこの設定を引き上げる
model_reasoning_effort = "low"

# 大量のコマンド出力が会話のコンテキストを埋め尽くさないようにする
tool_output_token_limit = 6000

# コンテキストが過大になる前に、Codexに圧縮を促す
model_auto_compact_token_limit = 64000
model_auto_compact_token_limit_scope = "total"

compact_prompt = """
タスクを継続するために必要な情報だけを残す:
- ユーザーの目的と明示された制約
- すでに決定したこと
- 変更または確認したファイル
- 実行したコマンドと重要な結果
- 残タスクまたはブロッカー

詳細ログ、重複した探索メモ、不要な説明は捨てる。
圧縮後の文脈は簡潔な日本語で書く。
"""
